<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Fondo Contenedor Terminal -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#1a1b26" stroke="#38bdf8" stroke-width="3"/>

  <!-- Puntos Decorativos Header Terminal -->
  <circle cx="12" cy="12" r="2.5" fill="#f7768e" />
  <circle cx="20" cy="12" r="2.5" fill="#e0af68" />
  <circle cx="28" cy="12" r="2.5" fill="#9ece6a" />

  <!-- Símbolo Lógico Central (Operador Conjunción ∧) -->
